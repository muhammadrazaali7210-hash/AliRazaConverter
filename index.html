<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Quantum Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JARVIS QUANTUM CORE</h1>
        <p class="subtitle">Maximum Capacity Media Engine</p>
        
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" multiple style="display: none;">
            <p id="fileLabel">Drop files here or click to select</p>
        </div>

        <div class="controls">
            <label for="formatSelect">SELECT TARGET BATCH TRANSLATION PROTOCOL</label>
            <select id="formatSelect">
                <optgroup label="Image Formats">
                    <option value="PNG">PNG (Lossless Matrix Image)</option>
                    <option value="JPG">JPG / JPEG (Compressed Image)</option>
                    <option value="WEBP">WEBP (Web Optimized Engine)</option>
                    <option value="GIF">GIF (Graphics Interchange Format)</option>
                    <option value="BMP">BMP (Bitmap Standard)</option>
                    <option value="TIFF">TIFF (High Dynamic Range)</option>
                    <option value="ICO">ICO (Icon Resource Asset)</option>
                </optgroup>
                <optgroup label="Document Formats">
                    <option value="PDF">PDF (Document Compilation)</option>
                </optgroup>
            </select>

            <div id="progressContainer" class="progress-container" style="display: none;">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <button id="convertBtn">Compile & Execute Batch</button>
        </div>

        <div id="status" class="status-box">System Standing By, sir.</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
