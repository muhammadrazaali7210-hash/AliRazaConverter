<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Quantum Core</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <h1>JARVIS QUANTUM CORE</h1>
            <p class="subtitle">High-Performance Dynamic Media Engine</p>
        </header>
        
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            <div class="upload-icon">⚡</div>
            <p id="fileLabel">Drop files here or click to select batch</p>
        </div>

        <div class="controls">
            <label for="formatSelect">TARGET TRANSLATION PROTOCOL</label>
            <select id="formatSelect">
                <option value="pdf">PDF (Document Compilation)</option>
                <option value="png">PNG (Lossless Matrix Image)</option>
                <option value="jpg">JPG / JPEG (Compressed Image)</option>
            </select>

            <button id="convertBtn">Compile & Execute Batch</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <span id="statusText">System Standing By...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
