<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Quantum Core</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #00d2ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00d2ff;
            text-align: center;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 13px;
            color: #5c708a;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: #121826;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .drop-zone {
            border: 2px dashed #0055ff;
            border-radius: 8px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone:hover {
            border-color: #00d2ff;
            background-color: rgba(0, 210, 255, 0.03);
        }

        .label-text {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        select {
            width: 100%;
            padding: 14px;
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2300d2ff" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        select option {
            background-color: #121826;
            color: #e2e8f0;
        }

        optgroup {
            color: #00d2ff;
            background-color: #0b0f19;
            font-weight: bold;
        }

        .btn-execute {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #0055ff, #00d2ff);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: opacity 0.2s;
        }

        .btn-execute:active {
            opacity: 0.8;
        }

        .status-box {
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #00d2ff;
            font-family: monospace;
            word-break: break-word;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="title">JARVIS QUANTUM CORE</div>
    <div class="subtitle">Maximum Capacity Media Engine</div>

    <div class="card">
        <div class="drop-zone" id="drop-zone">
            <span id="file-label">Tap to Initialize Target Asset Streams (Unlimited Input)</span>
            <input type="file" id="file-input" multiple>
        </div>

        <span class="label-text">SELECT TARGET BATCH TRANSLATION PROTOCOL</span>
        <select id="protocol-select">
            <optgroup label="Matrix">
                <option value="PNG">PNG (Lossless Matrix Image)</option>
                <option value="JPG">JPG (Compressed Matrix Image)</option>
                <option value="WEBP">WEBP (Modern Web Image)</option>
            </optgroup>
            <optgroup label="Document Compiler (All files into ONE)">
                <option value="PDF">PDF (Unified Master Document)</option>
            </optgroup>
            <optgroup label="Media (FFmpeg WebAssembly Core)">
                <option value="MP3">MP3 (True Audio Layer Rewrite)</option>
                <option value="M4A">M4A (AAC Audio Container)</option>
                <option value="WAV">WAV (Uncompressed Audio PCM)</option>
                <option value="MP4">MP4 (True H.264 Video Encode)</option>
                <option value="MKV">MKV (Matroska Media Container)</option>
            </optgroup>
        </select>

        <button class="btn-execute" id="execute-btn">Compile & Execute Batch</button>

        <div class="status-box" id="status-box">System Standing By, sir.</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
